<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tokyo Rail Network — Offline</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #05080b;
    color: #e8f1f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main {
    width: min(680px, calc(100% - 40px));
    line-height: 1.65;
  }
  h1 { font-size: 1.35rem; margin: 0 0 1rem; }
  p { margin: .7rem 0; }
  .muted { color: #9aa9b2; }
  a { color: #9fdcff; }
</style>
</head>
<body>
<main>
  <h1>Tokyo Rail Network — Offline</h1>
  <div id="browser-instructions">
    <p>iPadでオフライン閲覧するための入口です。</p>
    <p>Safariの共有メニューから「ホーム画面に追加」してください。</p>
    <p>追加後、ホーム画面のアイコンから<strong>オンライン状態で一度起動</strong>してください。TRNが表示された後は、通信がない状態でも起動できます。</p>
    <p class="muted">通常のWeb版には影響しません。このページをホーム画面Webアプリとして開いた場合だけ、オフライン用データを保存します。</p>
    <p><a href="../../0.1.5x/TRN_0.1.5x_CLOSED_FINAL_0.1.5at1.html">通常のTRNを開く</a></p>
  </div>
  <div id="app-status" hidden>
    <p id="status">オフライン用データを準備しています…</p>
    <p class="muted">初回起動時はインターネット接続が必要です。</p>
  </div>
</main>
<script>
(() => {
  const TARGET = './TRN_0.1.5x_CLOSED_FINAL_0.1.5at1.html';
  const isStandalone =
    window.navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches;

  if (!isStandalone) return;

  const browserInstructions = document.getElementById('browser-instructions');
  const appStatus = document.getElementById('app-status');
  const status = document.getElementById('status');

  browserInstructions.hidden = true;
  appStatus.hidden = false;

  (async () => {
    try {
      if (!('serviceWorker' in navigator)) {
        throw new Error('Service Worker is not available');
      }

      await navigator.serviceWorker.register('./sw.js', { scope: './' });
      await navigator.serviceWorker.ready;

      status.textContent = 'TRNを起動します…';
      location.replace(TARGET);
    } catch (error) {
      status.textContent =
        'オフライン用データを準備できませんでした。オンライン接続を確認して、もう一度起動してください。';
      console.error(error);
    }
  })();
})();
</script>
</body>
</html>
